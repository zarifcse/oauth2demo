<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; }
        .card { border: 1px solid #ccc; padding: 20px; display: inline-block; border-radius: 10px; }
        .btn { padding: 10px 20px; font-size: 16px; background-color: #d9534f; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <h1>User Dashboard</h1>
    <p>Authentication Status: Authenticated</p>
    <p>Name: <strong th:text="${name}"></strong></p>
    <p>Email: <strong th:text="${email}"></strong></p>
    <br>
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn">Logout</button>
    </form>
</div>
</body>
</html>
